<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tech Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">TechStore</div>
        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>
        <div class="cart-icon" id="cart-btn">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Next-Gen Tech Essentials</h1>
        <p>Upgrade your lifestyle with the latest gear.</p>
        <a href="#products" class="btn">Shop Now</a>
    </section>

    <!-- Main Content -->
    <main class="container">
        <!-- Category Filter -->
        <div class="categories">
            <button class="category-btn active" onclick="filterProducts('all')">All</button>
            <button class="category-btn" onclick="filterProducts('audio')">Audio</button>
            <button class="category-btn" onclick="filterProducts('wearables')">Wearables</button>
            <button class="category-btn" onclick="filterProducts('accessories')">Accessories</button>
        </div>

        <!-- Product Grid -->
        <section id="products" class="product-grid">
            <!-- JS will populate products here -->
        </section>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button id="close-cart">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Dynamic Cart Items -->
        </div>
        <div class="cart-footer">
            <div class="total-price">
                <span>Total:</span>
                <span id="cart-total">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
