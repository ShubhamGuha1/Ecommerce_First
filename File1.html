<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Deals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">TechStore</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
            <a href="File1.html">Deals</a>
        </nav>
    </header>

    <section class="hero" style="padding: 3rem 1rem;">
        <h1>Weekend Tech Deals</h1>
        <p>Save big on smart gadgets, accessories, and everyday essentials.</p>
        <a href="index.html" class="btn">Back to Store</a>
    </section>

    <main class="container" style="padding: 2rem 20px 4rem;">
        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500&q=80" alt="Deal Product 1">
                <div class="product-info">
                    <h3 class="product-title">Premium Wireless Earbuds</h3>
                    <p class="product-price">$69.99</p>
                    <button class="add-to-cart-btn" onclick="alert('Added to cart from deals page!')">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=500&q=80" alt="Deal Product 2">
                <div class="product-info">
                    <h3 class="product-title">Mini Gaming Laptop</h3>
                    <p class="product-price">$899.99</p>
                    <button class="add-to-cart-btn" onclick="alert('Added to cart from deals page!')">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500&q=80" alt="Deal Product 3">
                <div class="product-info">
                    <h3 class="product-title">Smart Home Speaker</h3>
                    <p class="product-price">$89.99</p>
                    <button class="add-to-cart-btn" onclick="alert('Added to cart from deals page!')">Add to Cart</button>
                </div>
            </div>
        </div>
    </main>

</html>
